<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dino AR</title>

  <script type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js">
  </script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #f2f2f2;
    }

    model-viewer {
      width: 100%;
      height: 100%;
      background: transparent;
    }

    #ar-button {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      padding: 14px 24px;
      font-size: 18px;
      border: none;
      border-radius: 999px;
      background: #007AFF;
      color: white;
      cursor: pointer;
    }
  </style>
</head>

<body>

<model-viewer
  src="./momma_trex_anim.glb"
  ios-src="./momma_trex_anim.usdz"
  alt="Animated Dinosaur"
  autoplay
  camera-controls
  ar
  ar-placement="floor"
  ar-modes="webxr scene-viewer quick-look">

  <button id="ar-button" slot="ar-button">
    🦖 View Dino in AR
  </button>

</model-viewer>

</body>
</html>
