<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dino AR</title>

  <script type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js">
  </script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
    }

    model-viewer {
      width: 100%;
      height: 100%;
      --poster-color: transparent;
      background: transparent;
    }

    /* Hide the 3D model before AR */
    model-viewer::part(default-progress-bar),
    model-viewer::part(default-ar-button),
    model-viewer::part(default-loading-spinner) {
      display: none;
    }

    /* Cover the preview with a white layer */
    .overlay {
      position: fixed;
      inset: 0;
      background: white;
      display: flex;
      justify-content: center;
      align-items: center;
      pointer-events: none;
      z-index: 5;
    }

    /* Our custom AR button */
    #ar-button {
      pointer-events: auto;
      padding: 18px 36px;
      font-size: 22px;
      font-weight: bold;
      border: none;
      border-radius: 999px;
      background: #007AFF;
      color: white;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(0,0,0,.2);
    }

    #ar-button:active {
      transform: scale(0.98);
    }
  </style>
</head>

<body>

<model-viewer
  id="viewer"
  src="./momma_trex_anim.glb"
  ios-src="./momma_trex_anim.usdz"
  ar
  autoplay
  ar-placement="floor"
  ar-modes="webxr scene-viewer quick-look">

  <button id="ar-button" slot="ar-button">
    🦖 View Dino in AR
  </button>

</model-viewer>

<div class="overlay"></div>

</body>
</html>
