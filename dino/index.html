
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Dino AR Test</title>

  <script
    type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js">
  </script>

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #eeeeee;
    }

    model-viewer {
      width: 100%;
      height: 100%;
    }

    #ar-button {
      padding: 14px 22px;
      border: 0;
      border-radius: 999px;
      font-size: 18px;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <model-viewer
    src="./momma_trex_anim.glb"
    alt="Animated dinosaur"
    ar
    ar-modes="webxr scene-viewer quick-look"
    ar-placement="floor"
    camera-controls
    autoplay
    shadow-intensity="1">

    <button id="ar-button" slot="ar-button">
      View Dino in AR
    </button>

  </model-viewer>
</body>
</html>
